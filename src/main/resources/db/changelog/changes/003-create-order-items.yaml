databaseChangeLog:
  - changeSet:
      id: 003-create-order-items
      author: huong
      changes:
        # Raw SQL because line_total is a Postgres GENERATED ALWAYS AS (...) STORED
        # column — Liquibase's createTable has no portable way to express this.
        - sql:
            splitStatements: true
            sql: >
              CREATE TABLE order_items (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                order_id BIGINT NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
                product_id BIGINT NOT NULL,
                product_sku VARCHAR(100) NOT NULL,
                product_name VARCHAR(255) NOT NULL,
                variant_name VARCHAR(255),
                unit_price NUMERIC(14,2) NOT NULL,
                quantity INT NOT NULL,
                discount_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
                tax_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
                line_total NUMERIC(14,2) GENERATED ALWAYS AS
                  (unit_price * quantity - discount_amount + tax_amount) STORED,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
      rollback:
        - sql:
            sql: DROP TABLE order_items;
