databaseChangeLog:
  - changeSet:
      id: 008-create-order-return-items
      author: huong
      changes:
        - createTable:
            tableName: order_return_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_return_items_order
                    references: orders(id)
              - column:
                  name: order_item_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_return_items_order_item
                    references: order_items(id)
              - column:
                  name: rma_code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: REQUESTED
                  constraints:
                    nullable: false
              - column:
                  name: reason_code
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: reason_text
                  type: varchar(500)
              - column:
                  name: quantity_returned
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: condition
                  type: varchar(20)
              - column:
                  name: refund_amount
                  type: numeric(14,2)
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: requested_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: resolved_at
                  type: timestamptz
      rollback:
        - dropTable:
            tableName: order_return_items
